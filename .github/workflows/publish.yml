name: RemoteGate · 检查与发布
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('检查 · {0}', github.event.pull_request.title)
      || startsWith(github.ref, 'refs/tags/v')
      && format('发布 RemoteGate {0}', github.ref_name)
      || format('构建 · {0}', github.event.head_commit.message || github.ref_name) }}

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remotegate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 代码与版本检查
    outputs:
      version: ${{ steps.release.outputs.version }}
      built_at: ${{ steps.release.outputs.built_at }}
      package_version: ${{ steps.release.outputs.package_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: 核对版本与中文更新说明
        id: release
        run: |
          python3 scripts/release_metadata.py
          python3 -m unittest discover -s scripts -p 'test_release_metadata.py'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.9"
          cache: true
      - name: Run tests and vet
        run: |
          go test -race ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          for file in cmd/server/web/*.js deploy/openwrt/luci/page.js; do node --check "$file"; done
          node scripts/check-console.cjs
          node --test scripts/test-mapping-editor.cjs
          node --test scripts/test-auth.cjs
          node --test scripts/test-mapping-access.cjs
          node --test scripts/test-refresh.cjs
          node --test scripts/test-clipboard.cjs
          node --test scripts/test-domain-https.cjs
          node --test scripts/test-https-deploy.cjs
          node --test scripts/test-plugin-update.cjs
          node --test scripts/test-device-center.cjs
          node --test scripts/test-remote-access.cjs
          node --test scripts/test-package-center.cjs
          node --test scripts/test-router-connection.cjs
      - name: Verify WAN routing survives proxy failures
        run: |
          go test -c -o /tmp/remotegate-agent.test ./cmd/agent
          sudo apt-get update -qq
          sudo apt-get install -y nftables iproute2 iptables
          sudo DIRECT_TEST_BINARY=/tmp/remotegate-agent.test sh scripts/test-direct-routing.sh

  container-test:
    name: 容器部署验证
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REMOTE_GATE_IMAGE: remotegate:smoke
      REMOTE_GATE_DATA_DIR: ./data
      LISTEN_ADDR: 127.0.0.1:18090
      HTTPS_LISTEN_ADDR: 127.0.0.1:443
      HEALTHCHECK_URL: http://127.0.0.1:18090/healthz
      SMOKE_BASE_URL: http://127.0.0.1:18090
      PUBLIC_URL: https://console.smoke.test
      SMOKE_PUBLIC_URL: http://console.smoke.test
      SMOKE_TLS_PORT: "443"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build test image with bundled router packages
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: remotegate:smoke
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_BUILD_TIME=${{ needs.checks.outputs.built_at }}
          cache-from: type=gha,scope=smoke
          cache-to: type=gha,mode=max,scope=smoke
      - name: Verify compact image layers
        run: |
          docker image save remotegate:smoke --output /tmp/remotegate-image.tar
          python3 scripts/check-image-layers.py /tmp/remotegate-image.tar
      - name: Validate Compose and start a fresh installation
        run: |
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 60
          python3 scripts/smoke-deployment.py setup
          container_id=$(docker compose ps -q remotegate)
          mkdir -p dist
          docker cp "$container_id:/opt/remotegate/packages/." dist/
          python3 scripts/release-assets.py
      - name: Check packaged router scripts and CPU architectures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          lua5.1 scripts/test-router-model.lua deploy/openwrt/luci/model.lua
          lua5.1 scripts/test-router-status.lua deploy/openwrt/luci/controller.lua
          python3 -m unittest discover -s scripts -p 'test_router_lifecycle.py'
          python3 scripts/check-router-packages.py "dist/RemoteGate-${{ needs.checks.outputs.package_version }}-istore.run"
      - name: Verify restart preserves administrator, domains and certificates
        run: |
          docker compose restart
          docker compose up -d --wait --wait-timeout 60
          python3 scripts/smoke-deployment.py restart
          docker compose exec -T remotegate sh -c 'test "$(stat -c %a /data/admin.json)" = 600'
          docker compose exec -T remotegate awk '/^Uid:/ { if ($2 != 10001) exit 1; found=1 } END { if (!found) exit 1 }' /proc/1/status
      - name: Show logs and stop test containers
        if: always()
        run: |
          docker compose logs --tail=100
          docker compose down

  publish:
    name: 发布容器镜像
    if: github.event_name != 'pull_request'
    needs: [checks, container-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha,format=long
          labels: |
            org.opencontainers.image.version=v${{ needs.checks.outputs.version }}
      - name: Publish AMD64 and ARM64 images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_BUILD_TIME=${{ needs.checks.outputs.built_at }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish

  release:
    name: 发布版本与更新说明
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate bundled installers and prepare server deployment assets
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        run: |
          docker pull "$IMAGE"
          container_id=$(docker create "$IMAGE")
          mkdir -p dist
          docker cp "$container_id:/opt/remotegate/packages/." dist/
          docker rm "$container_id"
          python3 scripts/release-assets.py
      - name: Publish version notes and downloadable assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > /tmp/release-state.txt 2>/dev/null; then
            if [ "$(cat /tmp/release-state.txt)" = false ]; then
              echo 'This version is already released; published assets remain unchanged.'
              exit 0
            fi
          else
            gh release create "$TAG" --verify-tag --draft --title "$(cat dist/release-title.txt)" --notes-file dist/release-notes.md
          fi
          gh release upload "$TAG" dist/releases/"$TAG"/* --clobber
          gh release edit "$TAG" --title "$(cat dist/release-title.txt)" --notes-file dist/release-notes.md --draft=false --latest
