name: Test and publish RemoteGate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remotegate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: true
      - name: Run tests and vet
        run: |
          go test -race ./...
          go vet ./...
          for file in cmd/server/web/*.js deploy/openwrt/luci/page.js; do node --check "$file"; done

  container-test:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REMOTE_GATE_IMAGE: remotegate:smoke
      REMOTE_GATE_DATA_DIR: ./data
      LISTEN_ADDR: 127.0.0.1:18090
      HTTPS_LISTEN_ADDR: 127.0.0.1:443
      HEALTHCHECK_URL: http://127.0.0.1:18090/healthz
      SMOKE_BASE_URL: http://127.0.0.1:18090
      SMOKE_TLS_PORT: "443"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build test image with bundled router packages
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: remotegate:smoke
          cache-from: type=gha,scope=smoke
          cache-to: type=gha,mode=max,scope=smoke
      - name: Validate Compose and start a fresh installation
        run: |
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 60
          python3 scripts/smoke-deployment.py setup
      - name: Verify restart preserves administrator, domains and certificates
        run: |
          docker compose restart
          docker compose up -d --wait --wait-timeout 60
          python3 scripts/smoke-deployment.py restart
          docker compose exec -T remotegate sh -c 'test "$(stat -c %a /data/admin.json)" = 600'
          docker compose exec -T remotegate awk '/^Uid:/ { if ($2 != 10001) exit 1; found=1 } END { if (!found) exit 1 }' /proc/1/status
      - name: Show logs and stop test containers
        if: always()
        run: |
          docker compose logs --tail=100
          docker compose down

  publish:
    if: github.event_name != 'pull_request'
    needs: container-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=long
      - name: Publish AMD64 and ARM64 images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish
