services:
  remotegate:
    image: ${REMOTE_GATE_IMAGE:-ghcr.io/yehao9589/remotegate:stable}
    restart: unless-stopped
    # Linux server: keep the bootstrap console local, expose native HTTPS.
    network_mode: host
    environment:
      CONSOLE_HOST: ${CONSOLE_HOST:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      LISTEN_ADDR: ${LISTEN_ADDR:-127.0.0.1:18088}
      HTTPS_LISTEN_ADDR: "${HTTPS_LISTEN_ADDR-:443}"
      # Optional: provision the first console certificate before HTTPS installation.
      BOOTSTRAP_DOMAIN: ${BOOTSTRAP_DOMAIN:-}
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-}
      BOOTSTRAP_DNS_PROVIDER: ${BOOTSTRAP_DNS_PROVIDER:-}
      BOOTSTRAP_DNS_ACCESS_KEY: ${BOOTSTRAP_DNS_ACCESS_KEY:-}
      BOOTSTRAP_DNS_SECRET_KEY: ${BOOTSTRAP_DNS_SECRET_KEY:-}
      BOOTSTRAP_ACME_TERMS_ACCEPTED: "${BOOTSTRAP_ACME_TERMS_ACCEPTED:-false}"
      STATE_PATH: /data/state.json
      HEALTHCHECK_URL: ${HEALTHCHECK_URL:-http://127.0.0.1:18088/healthz}
      TZ: Asia/Shanghai
    volumes:
      - ${REMOTE_GATE_DATA_DIR:-./data}:/data
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
